name: Prepare approved submission
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open project-submission issue number to prepare for review
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify maintainer and prepare review branch / pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_ACTOR: ${{ github.event.sender.login || github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python3 scripts/accept_submission.py
